name: tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q
      - run: python scripts/build_corpus.py --output dist/corpus
      - run: python -c "import json; from pathlib import Path; p=Path('dist/corpus/validation-manifest.json'); assert len(json.loads(p.read_text())['artifacts']) >= 20"
      - run: python scripts/build_release.py dist/xrefgen-ci.zip
      - run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          required = {
              "xrefgen/xrefgen_config.json",
              "xrefgen/docs/compatibility.md",
              "xrefgen/SECURITY.md",
              "xrefgen/scripts/build_corpus.py",
              "xrefgen/scripts/run_corpus_matrix.py",
              "xrefgen/scripts/ida_corpus_tests.py",
              "xrefgen/scripts/ida_real_tests.py",
              "xrefgen/scripts/install_ida.py",
          }
          with zipfile.ZipFile(Path("dist/xrefgen-ci.zip")) as archive:
              names = set(archive.namelist())
          missing = required - names
          if missing:
              raise SystemExit(f"release missing: {sorted(missing)}")
          PY
