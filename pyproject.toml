[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrefgen"
version = "0.5.0a1"
description = "High-confidence indirect control-flow recovery for IDA Pro and XRefer"
readme = "README.md"
